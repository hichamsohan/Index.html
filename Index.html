<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encore un peu… ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #160006, #4a0014, #170006);
    color: white;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 92%;
    max-width: 600px;
    padding: 35px 20px;
}

.heart {
    font-size: 70px;
    animation: beat 1.2s infinite;
}

h1 {
    font-size: 32px;
    margin: 15px 0;
}

.subtitle {
    font-size: 20px;
    line-height: 1.5;
    opacity: 0.95;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 30px 0;
}

.box {
    background: rgba(255,255,255,0.12);
    border-radius: 15px;
    padding: 15px 5px;
    backdrop-filter: blur(5px);
}

.number {
    font-size: 28px;
    font-weight: bold;
}

.label {
    font-size: 12px;
    margin-top: 5px;
    opacity: 0.8;
}

.final {
    font-size: 24px;
    line-height: 1.5;
    display: none;
}

.signature {
    margin-top: 30px;
    font-size: 18px;
    font-style: italic;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Encore un peu de patience…</h1>

    <div class="subtitle">
        Après deux semaines sans te voir,<br>
        chaque seconde me rapproche de toi…
    </div>

    <div class="countdown" id="countdown">

        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">JOURS</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">HEURES</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDES</div>
        </div>

    </div>

    <div class="final" id="final">
        ❤️ Ça y est… ❤️<br><br>
        Enfin réunis.<br>
        Enfin toi et moi.
    </div>

    <div class="signature">
        Plus que quelques secondes avant de te retrouver…<br>
        ❤️ Hicham
    </div>

</div>

<script>

const target = new Date("2026-08-23T19:00:00+02:00").getTime();

function updateCountdown() {

    const now = new Date().getTime();
    const difference = target - now;

    if (difference <= 0) {

        document.getElementById("countdown").style.display = "none";
        document.getElementById("final").style.display = "block";

        return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((difference / (1000 * 60)) % 60);
    const seconds = Math.floor((difference / 1000) % 60);

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
